version: "3.8"

services:
  parallel:
    build: .
    image: parallel-app:latest
    container_name: parallel
    ports:
      - "8080:8080"
    environment:
      # 必填: 修改为你的Redis地址
      - DATABASE_PATH=/app/data/parallel.db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=please-change-me
      # 可选: 输出与上传目录（容器内路径固定，不建议改）
      - TRANSCODE_OUTPUT=/app/data/output
      - UPLOAD_DIR=/app/data/uploads
      - FFMPEG_BINARY=ffmpeg
      - HTTP_ADDR=:8080
    volumes:
      - parallel-data:/app/data
      - parallel-uploads:/app/data/uploads
      - parallel-output:/app/data/output
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: parallel-redis
    ports:
      - "6379:6379"

volumes:
  parallel-data:
  parallel-uploads:
  parallel-output:

